# bal scan rule excluded for this package: ballerina/crypto:1 (RSA encryption with the default PKCS1 padding).
#
# This is a KNOWN WEAKNESS, not a false positive. `crypto:encryptRsaEcb` is used in the WS-Security (wssec)
# module with PKCS#1 v1.5 padding, and the EncryptedKey is declared as `rsa-1_5` by the native WsSecurityUtils.
# The padding has to match the declared key-transport algorithm that peer SOAP services expect, so it cannot be
# changed in isolation without breaking the wire format.
#
# The proper fix (RSA-OAEP as an opt-in algorithm, then as the default) is tracked in
# https://github.com/wso2/product-integrator/issues/2821. Remove this exclusion when that is done.
#
# NOTE: bal scan can only exclude a rule for the whole package, so other uses of `crypto:encryptRsaEcb` in
# this package are not flagged while this exclusion is in place. Review such code by hand.
#
# ballerina:14 is a false positive. It matches the identifier names `securityToken`, `usernameTokenTag` and
# `passwordTag`, which are regular expressions for XML elements (e.g. `<wsse:SecurityTokenReference ...>`) used to
# build/assert SOAP envelopes (wssec/ws_security_methods.bal and the soap_utils.bal assertion helpers, where the
# password is a function parameter). No secret value is hardcoded.
# TODO: replace this rule exclusion with a targeted scan suppression (with a reason) once `bal scan` supports it
# (planned for v0.13.0), and fix the false positives on the scan tool side: a secret-named identifier should only be
# reported when it is assigned a fixed value.
[rule]
exclude = ["ballerina/crypto:1", "ballerina:14"]
